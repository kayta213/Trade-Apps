
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
  <div class="card p-4 shadow" style="max-width: 400px; width: 100%;">
    <h3 class="text-center mb-3">Login</h3>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
  </div>

  <script>
    const db = supabase.createClient(
      "https://bxequpwnyufpmflbgznu.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4ZXF1cHdueXVmcG1mbGJnem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTIxMTQ1OTAsImV4cCI6MjA2NzY5MDU5MH0.g2objN8BBmzuIcGzkY_S-uezUteksc5BaIvqUtlfYmI"
    );

    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        const { data: users, error } = await db
          .from("users")
          .select("*")
          .eq("username", username)
          .eq("password", password);

        if (error) throw error;

        if (users.length === 1) {
          const user = users[0];
          localStorage.setItem("currentUser", JSON.stringify(user));
          alert("✅ Login successful!");

          // Redirect by role
          if (user.role === "owner") {
            window.location.href = "owner_dashboard.html";
          } else if (user.role === "admin") {
            window.location.href = "admin.html";
          } else {
            window.location.href = "index.html";
          }

        } else {
          alert("❌ Invalid username or password.");
        }
      } catch (err) {
        console.error("Login error:", err);
        alert("❌ Login failed: " + err.message);
      }
    });
  </script>
</body>
</html>
