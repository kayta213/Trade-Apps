
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
  <div class="card p-4 shadow" style="max-width: 400px; width: 100%;">
    <h3 class="text-center mb-3">Register</h3>
    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Role</label>
        <select class="form-select" id="role" required>
          <option value="">Select role</option>
          <option value="owner">Owner</option>
          <option value="admin">Admin</option>
          <option value="member">Member</option>
        </select>
      </div>
      <button type="submit" class="btn btn-success w-100">Register</button>
    </form>
  </div>

  <script>
    const db = supabase.createClient(
      "https://bxequpwnyufpmflbgznu.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4ZXF1cHdueXVmcG1mbGJnem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTIxMTQ1OTAsImV4cCI6MjA2NzY5MDU5MH0.g2objN8BBmzuIcGzkY_S-uezUteksc5BaIvqUtlfYmI"
    );

    document.getElementById("registerForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const role = document.getElementById("role").value;

      if (!username || !password || !role) {
        alert("❗ All fields are required.");
        return;
      }

      try {
        const { data: existingUser, error: userError } = await db
          .from("users")
          .select("*")
          .eq("username", username);

        if (userError) throw userError;
        if (existingUser.length > 0) {
          alert("❌ Username already exists.");
          return;
        }

        if (role === "owner") {
          const { data: ownerCheck, error: ownerError } = await db
            .from("users")
            .select("*")
            .eq("role", "owner");

          if (ownerError) throw ownerError;
          if (ownerCheck.length > 0) {
            alert("❌ Only one owner allowed.");
            return;
          }
        }

        const { error } = await db
          .from("users")
          .insert([{ username, password, role, bio: "" }]);

        if (error) {
          throw error;
        } else {
          alert("✅ Registration successful!");
          window.location.href = "login.html";
        }

      } catch (err) {
        console.error("Register Error:", err);
        alert("❌ Failed to register: " + err.message);
      }
    });
  </script>
</body>
</html>
